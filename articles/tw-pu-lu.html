<p>埔里：梨、清境、九芎 是台灣的熱門旅遊主題。本文整理 3 項必做、交通要點與一個實用提示，方便你快速規劃。</p>
<h2>3 項必做</h2>
<ol><li>主要景勝：建議早上 9-11 點到訪，人少、光線好。</li><li>在地美食：挑一間口碑好的店家，午晚餐時段最便宜。</li><li>彈性時間：留 1 小時給拍照與購物。</li></ol>
<h2>交通提示</h2>
<p>使用大眾運輸＋備好 eSIM 流量，落地即連網，不用等實體卡。</p>
