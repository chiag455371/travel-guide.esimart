<h1>大阪道頓堀、心齋橋</h1>
<figure><img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/4/47/Dotonbori%2C_Osaka%2C_at_night%2C_November_2016.jpg/1280px-Dotonbori%2C_Osaka%2C_at_night%2C_November_2016.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail" alt="大阪道頓堀、心齋橋" loading="lazy"><figcaption>圖：<bdi>Martin Falbisoner</bdi>（CC BY-SA 4.0，來源 [https://commons.wikimedia.org](https://commons.wikimedia.org)）</figcaption></figure>

<p>大阪道頓堀、心齋橋 是日本的熱門旅遊主題。本文整理 3 項必做、交通要點與一個實用提示，方便你快速規劃。</p>
<h2>3 項必做</h2>
<ol><li>主要景勝：建議早上 9-11 點到訪，人少、光線好。</li><li>在地美食：挑一間口碑好的店家，午晚餐時段最便宜。</li><li>彈性時間：留 1 小時給拍照與購物。</li></ol>
<h2>交通提示</h2>
<p>使用大眾運輸＋備好 eSIM 流量，落地即連網，不用等實體卡。</p>
