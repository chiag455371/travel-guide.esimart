<figure><img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fb/%E5%9E%A6%E4%B8%81%E5%B0%8F%E6%B9%BE_-_Kenting_Little_Bay_-_2012.02_-_panoramio.jpg/1280px-%E5%9E%A6%E4%B8%81%E5%B0%8F%E6%B9%BE_-_Kenting_Little_Bay_-_2012.02_-_panoramio.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail" alt="屏東恆春、墾丁、南洲" loading="lazy"><figcaption>圖：<a rel="nofollow" class="external text" href="https://web.archive.org/web/20161024094151/http://www.panoramio.com/user/5226993?with_photo_id=79167554">rheins</a>（CC BY 3.0，來源 [https://commons.wikimedia.org](https://commons.wikimedia.org)）</figcaption></figure>

<p>屏東恆春、墾丁、南洲 是台灣的熱門旅遊主題。本文整理 3 項必做、交通要點與一個實用提示，方便你快速規劃。</p>
<h2>3 項必做</h2>
<ol><li>主要景勝：建議早上 9-11 點到訪，人少、光線好。</li><li>在地美食：挑一間口碑好的店家，午晚餐時段最便宜。</li><li>彈性時間：留 1 小時給拍照與購物。</li></ol>
<h2>交通提示</h2>
<p>使用大眾運輸＋備好 eSIM 流量，落地即連網，不用等實體卡。</p>
